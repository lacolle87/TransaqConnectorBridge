[server]
dll_path = txmlconnector64.dll
port     = 9999
buffer_size_kb = 1024

[logging]
path        = .\logs
dll_path    = .\dll_logs
level       = 2
max_size_mb = 2
max_files   = 5
tz_offset   = 3

[timeouts]
cmd_recv_ms           = 5000
stream_send_ms        = 5000
keepalive_time_ms     = 60000
keepalive_interval_ms = 15000
handshake_ms          = 15000
